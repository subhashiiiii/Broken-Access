<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Profile Viewer</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>Welcome to Profile Viewer</h1>

  <p>Enter a user ID to view a profile (e.g., 101):</p>
  <form id="profileForm">
    <input type="text" id="userId" name="userId" value="101" />
    <button type="submit">View Profile</button>
  </form>

  <div id="profile" style="margin-top: 20px;"></div>

  <script src="script.js"></script>

  <script>
    // Wait until everything is fully loaded
    window.addEventListener('DOMContentLoaded', function () {
      const urlParams = new URLSearchParams(window.location.search);
      const userId = urlParams.get("userId");
      if (userId) {
        document.getElementById("userId").value = userId;
        document.getElementById("profileForm").dispatchEvent(new Event("submit", { cancelable: true, bubbles: true }));
      }
    });
  </script>
</body>
</html>
